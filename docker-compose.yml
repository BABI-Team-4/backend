services:
  mongodb:
    image: mongo:7.0.7
    container_name: cover-letter-mongo
    ports:
      - "27027:27017"
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      MONGO_INITDB_DATABASE: cover_letter


volumes:
  mongo_data:
